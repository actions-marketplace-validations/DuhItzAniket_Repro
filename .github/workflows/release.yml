# Release (H05): a published GitHub release gets the wheels of its version attached, after the
# same clean install and first run as CI's install job, and published to PyPI (1.2.0) through
# PyPI's trusted publishing: no token, each package from its own GitHub environment (`pypi`,
# `pypi-events`), which only release tags (v*) may use. repro-events goes first, since
# repro-engine requires it. Run by hand (workflow_dispatch), it builds and checks the wheels and
# keeps them as an artifact, and publishes nothing.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"

jobs:
  wheels:
    name: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # attach the wheels to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build the cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @repro/web build
      - name: Install Python environment
        run: uv sync --locked
      - name: Build the wheels
        run: uv run --locked python scripts/build_wheels.py
      - name: Install from the wheels and make a first run
        run: uv run --locked python scripts/install_check.py dist/wheels
      - name: The wheels are the release's version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          test -f "dist/wheels/repro_engine-${version}-py3-none-any.whl"
          test -f "dist/wheels/repro_events-${version}-py3-none-any.whl"
      - name: Attach them to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/wheels/*.whl --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/wheels/
          retention-days: 30

  pypi-events:
    name: PyPI (repro-events)
    if: github.event_name == 'release'
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-events
      url: https://pypi.org/project/repro-events/
    permissions:
      id-token: write # trusted publishing: PyPI checks this job's OIDC token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist/wheels/
      - name: Only repro-events
        run: mkdir dist/events && mv dist/wheels/repro_events-*.whl dist/events/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/events/

  pypi-engine:
    name: PyPI (repro-engine)
    if: github.event_name == 'release'
    needs: pypi-events
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/repro-engine/
    permissions:
      id-token: write # trusted publishing: PyPI checks this job's OIDC token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist/wheels/
      - name: Only repro-engine
        run: mkdir dist/engine && mv dist/wheels/repro_engine-*.whl dist/engine/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/engine/
