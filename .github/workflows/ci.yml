# CI pipeline (A06). Required checks on main: lint, test (ubuntu-latest), test (windows-latest),
# security. Every action is pinned to a full commit SHA. Dependabot keeps the pins current.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  HYPOTHESIS_PROFILE: ci # derandomised: a CI failure reproduces exactly

jobs:
  # The documentation fast path. Lists the files a pull request changes, both paths of a moved
  # file included; when every one is documentation that nothing builds, tests or packages
  # (scripts/ci_changes.py), the slow jobs skip. The required test jobs still run, with each
  # step skipped, so their checks report and pass. Lint and security always run. A push to
  # main runs everything, and so does any failure here: the jobs below run unless this job
  # positively says documentation only.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 2 # the merge commit and its two parents
      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD | python3 -I scripts/ci_changes.py >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Python environment
        run: uv sync --locked

      - name: Biome (lint + format, TS/JSON)
        run: pnpm lint
      - name: TypeScript (tsc --noEmit)
        run: pnpm typecheck
      - name: Ruff lint
        run: uv run --locked ruff check --output-format github
      - name: Ruff format
        run: uv run --locked ruff format --check
      - name: mypy (strict)
        run: uv run --locked mypy
      - name: Generated code is up to date (schema drift)
        run: uv run --locked repro-events-codegen --check

  test:
    name: test (${{ matrix.os }})
    needs: changes
    # Never skipped as a whole: a skipped matrix job reports no check per operating system,
    # and these checks are required. A failure in `changes` gives a full run.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # A guard against hangs, not a budget: the suite runs both sides of every fixture, traced
    # since E03, and a slow Windows runner took 13 minutes for 60 % of it (E03's first CI run).
    # With K08 and K11's real Vitest and compiler tests, Windows took 22 to 27 minutes on
    # 2026-10-20 and once passed 30 (Ubuntu: 11 to 13).
    timeout-minutes: 45
    steps:
      - name: Documentation only, so the suites are skipped (scripts/ci_changes.py)
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Every changed file is documentation. main runs everything once this merges."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0 # C07's pinned real-repository test analyses commits of this history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: needs.changes.outputs.docs_only != 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install JS dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile
      - name: JS tests
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm test
      - name: Web build
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm build
      - name: Bundle size (size-limit, 300 kB gzip; B12)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.docs_only != 'true'
        run: pnpm --filter @repro/web size
      - name: Model coverage (projections and store at least 90%; SDLC.md)
        if: matrix.os == 'ubuntu-latest' && needs.changes.outputs.docs_only != 'true'
        run: pnpm --filter @repro/web coverage
      - name: Install Python environment
        if: needs.changes.outputs.docs_only != 'true'
        run: uv sync --locked
      - name: Python tests (the agent evals run in their own job)
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run --locked pytest -m "not agent_eval and not chaos"
        env:
          # The L3 escape suite (D02) must run where Docker has Linux containers: Ubuntu.
          REPRO_REQUIRE_DOCKER: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
      - name: CLI smoke test
        if: needs.changes.outputs.docs_only != 'true'
        run: uv run --locked repro --version

  # G09: the agent evals. The reviewed pull requests are replayed from their cassettes, each
  # twice (as configured, and with every verdict judged in both orders), and held to
  # bench/data/thresholds.toml. They run apart from the test matrix, which is near its limit
  # on Windows, and no model is reached: replay never makes a call.
  agent-evals:
    name: agent evals
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python environment
        run: uv sync --locked
      - name: Agent evals
        run: uv run --locked pytest -m agent_eval

  # H01: the chaos tests. Each catalogued failure (docs/FAILURES.md) met for real by `repro run`:
  # a test module that no longer imports, a hang, memory exhausted, a build that cannot work
  # offline, an API nobody answers, Docker or git missing. Both operating systems, because the
  # sandbox enforces limits differently on each.
  chaos:
    name: chaos (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python environment
        run: uv sync --locked
      - name: Chaos tests
        run: uv run --locked pytest -m chaos

  # Gate C (C08): `repro run` on a real repository shows its import graph and blast radius in the
  # cockpit live, and `repro replay` reproduces the same state (apps/web/gate/gate-c.spec.ts).
  # The target, pallets/itsdangerous (BSD-3-Clause), is cloned at run time, never vendored.
  gate-c:
    name: gate C
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Web build
        run: pnpm --filter @repro/web build
      - name: Install Python environment
        run: uv sync --locked
      - name: Clone the target at its pinned commits
        run: |
          git clone --quiet --no-checkout https://github.com/pallets/itsdangerous.git "$RUNNER_TEMP/itsdangerous"
          git -C "$RUNNER_TEMP/itsdangerous" cat-file -e "93ae366874bbd4f69d90495c45b2cd336387496c^{commit}"
          git -C "$RUNNER_TEMP/itsdangerous" cat-file -e "7f4dcf83a07bb3d53f4e0e65ef1b43327b4cca90^{commit}"
      - name: Playwright's Chromium (the version pinned by @playwright/test)
        run: pnpm --filter @repro/web exec playwright install --with-deps chromium
      - name: Gate C
        run: pnpm --filter @repro/web exec playwright test -c playwright.gate.config.ts gate-c.spec.ts
        env:
          REPRO_GATE_REPO: ${{ runner.temp }}/itsdangerous
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-c
          path: |
            apps/web/playwright-report-gate/
            apps/web/test-results-gate/
          if-no-files-found: ignore
          retention-days: 14

  # Gate D (D07): Repro's fixtures run through `repro run` in full (containers: the runner has
  # Docker; environments from the package index), checked in the cockpit's panels.
  gate-d:
    name: gate D
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Web build
        run: pnpm --filter @repro/web build
      - name: Install Python environment
        run: uv sync --locked
      - name: Playwright's Chromium (the version pinned by @playwright/test)
        run: pnpm --filter @repro/web exec playwright install --with-deps chromium
      - name: Gate D
        run: pnpm --filter @repro/web exec playwright test -c playwright.gate.config.ts gate-d.spec.ts
        env:
          REPRO_SANDBOX: docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-d
          path: |
            apps/web/playwright-report-gate/
            apps/web/test-results-gate/
          if-no-files-found: ignore
          retention-days: 14

  # Gate E (E07): a change that alters an output no test checks shows as a stable behaviour
  # diff with its reproducer, and the noise of the A/A2 control does not (gate-e.spec.ts).
  gate-e:
    name: gate E
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Web build
        run: pnpm --filter @repro/web build
      - name: Install Python environment
        run: uv sync --locked
      - name: Playwright's Chromium (the version pinned by @playwright/test)
        run: pnpm --filter @repro/web exec playwright install --with-deps chromium
      - name: Gate E
        run: pnpm --filter @repro/web exec playwright test -c playwright.gate.config.ts gate-e.spec.ts
        env:
          REPRO_SANDBOX: docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: gate-e
          path: |
            apps/web/playwright-report-gate/
            apps/web/test-results-gate/
          if-no-files-found: ignore
          retention-days: 14

  # Visual regression (B12, ADR-0009): the cockpit at frozen replay moments, rendered with
  # SwiftShader in the Playwright image pinned by digest. Baselines are generated here only: when
  # none are committed, this job writes them, uploads them as the "visual" artifact and fails
  # until they are committed. It then checks that an injected visual change is caught.
  visual:
    name: visual
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Web build
        run: pnpm --filter @repro/web build
      - name: Are baselines committed?
        id: baselines
        shell: bash
        run: |
          if compgen -G "apps/web/e2e/__screenshots__/*.png" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate baselines (none committed yet)
        if: steps.baselines.outputs.present == 'false'
        run: pnpm --filter @repro/web e2e
        env:
          REPRO_UPDATE_SNAPSHOTS: "1"
      - name: Visual regression
        if: steps.baselines.outputs.present == 'true'
        run: pnpm --filter @repro/web e2e
      - name: Gate self-test (an injected visual change must fail)
        if: steps.baselines.outputs.present == 'true'
        shell: bash
        run: |
          if REPRO_INJECT=visual pnpm --filter @repro/web e2e; then
            echo "::error::the visual gate passed an injected regression"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: visual
          path: |
            apps/web/e2e/__screenshots__/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Baselines must be committed
        if: steps.baselines.outputs.present == 'false'
        run: |
          echo "::error::No visual baselines are committed. Commit apps/web/e2e/__screenshots__ from this run's 'visual' artifact."
          exit 1

  # Gate self-tests (B12): each quality gate must reject an injected regression of its kind.
  # The allocation and size gates themselves run in "test"; the perf gate also runs nightly.
  gates:
    name: gates
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Size gate rejects injected bloat
        shell: bash
        run: |
          REPRO_INJECT=size pnpm --filter @repro/web build
          if pnpm --filter @repro/web size; then
            echo "::error::the size gate passed 300 kB of injected data"
            exit 1
          fi
      - name: Allocation gate rejects an injected leak
        shell: bash
        run: |
          if REPRO_INJECT=alloc pnpm --filter @repro/web exec vitest run src/perf/alloc.test.ts; then
            echo "::error::the allocation gate passed an injected leak"
            exit 1
          fi
      - name: Perf gate (calibrated frame cost vs the CI baseline)
        id: perf
        shell: bash
        run: |
          if [ -f apps/web/perf/frame-cost-baseline.json ]; then
            pnpm --filter @repro/web perf
          else
            REPRO_PERF_RECORD=1 pnpm --filter @repro/web perf
            echo "::error::No perf baseline is committed. Commit apps/web/perf/frame-cost-baseline.json from this run's 'perf' artifact (perf-results/frame-cost-baseline.json)."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Perf gate rejects injected work
        if: steps.perf.outputs.missing != 'true'
        shell: bash
        run: |
          if REPRO_INJECT=perf pnpm --filter @repro/web perf; then
            echo "::error::the perf gate passed 2 ms of injected work per frame"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf
          path: apps/web/perf-results/
          if-no-files-found: ignore
          retention-days: 30
      - name: Perf baseline must be committed
        if: steps.perf.outputs.missing == 'true'
        run: exit 1

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the full history, not only the tip
      - name: Secret scan (gitleaks CLI, MIT-licensed image pinned by digest)
        run: >
          docker run --rm
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          -v "${{ github.workspace }}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --no-banner --exit-code 1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --locked
      - name: Licence allow-list (Python + JS)
        run: uv run --locked python scripts/check_licenses.py

  # H05: a release's wheels (scripts/build_wheels.py: the cockpit and the schemas inside),
  # installed as the README says into a tool directory of their own, then a first run on a small
  # repository, all inside ten minutes (scripts/install_check.py).
  install:
    name: install (${{ matrix.os }})
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Build the cockpit
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @repro/web build
      - name: Install Python environment
        run: uv sync --locked
      - name: Build the wheels
        run: uv run --locked python scripts/build_wheels.py
      - name: Install from the wheels and make a first run
        run: uv run --locked python scripts/install_check.py dist/wheels
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest'
        with:
          name: wheels
          path: dist/wheels/
          retention-days: 14

  # H03: known vulnerabilities in every locked dependency, Python (pip-audit, against PyPI's
  # advisories, hashes checked, nothing installed) and JavaScript (pnpm audit). Not a required
  # check: an advisory published today must not block unrelated work, but it shows on every PR.
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Python (pip-audit 2.10.1)
        run: |
          uv export --format requirements-txt --frozen --all-groups --no-emit-workspace \
            -o "$RUNNER_TEMP/requirements-audit.txt"
          uvx --from pip-audit==2.10.1 pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" \
            --require-hashes --disable-pip --strict --progress-spinner off
      - name: JavaScript (pnpm audit)
        run: |
          pnpm install --frozen-lockfile
          pnpm audit

  # H03: the container sandbox under gVisor (L4): the whole Docker test module, escape suite
  # included, and one fixture end to end. runsc comes from gVisor's apt repository, as
  # https://gvisor.dev/docs/user_guide/install/ says (checked 2026-10-17).
  gvisor:
    name: gvisor
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install gVisor as Docker's runsc runtime
        run: |
          curl -fsSL https://gvisor.dev/archive.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
            | sudo tee /etc/apt/sources.list.d/gvisor.list > /dev/null
          sudo apt-get update && sudo apt-get install -y runsc
          docker info --format '{{json .Runtimes}}' | grep -q '"runsc"' || sudo runsc install
          sudo systemctl reload docker
          runsc --version
          docker info --format '{{json .Runtimes}}'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python environment
        run: uv sync --locked
      - name: The container sandbox under gVisor
        env:
          REPRO_DOCKER_RUNTIME: runsc
          REPRO_REQUIRE_DOCKER: "1"
        run: >
          uv run --locked pytest engine/tests/test_sandbox_docker.py
          "engine/tests/test_run_stage.py::test_a_run_under_gvisor_is_l4"

  # K10: the container sandbox with each container in a Kata microVM (L5), set up by the same
  # script as a developer's host. GitHub says nested virtualization is "technically possible" on
  # its runners but "not officially supported" (docs.github.com, "GitHub-hosted runners", read
  # 2026-10-21), so the job is not required. The script stops first if /dev/kvm is missing.
  kata:
    name: kata
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Kata Containers with Cloud Hypervisor as Docker's runtime kata
        run: sudo bash scripts/kata/setup.sh
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python environment
        run: uv sync --locked
      - name: The container sandbox in microVMs
        env:
          REPRO_DOCKER_RUNTIME: kata
          REPRO_REQUIRE_DOCKER: "1"
        run: >
          uv run --locked pytest engine/tests/test_sandbox_docker.py
          "engine/tests/test_run_stage.py::test_a_run_under_kata_is_l5"
          "engine/tests/test_js_container.py::test_a_change_is_reproduced_in_microvms"

  # K09: the E2B sandbox on real Firecracker microVMs. E2B's self-hosted stack (Embed) is started
  # from its compose files at a pinned commit, checked by SHA-256, on GitHub's nested
  # virtualization (not officially supported, as for kata), so the job is not required. Its API
  # key is the local stack's own, made for this run.
  e2b:
    name: e2b
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: E2B Embed (e2b-dev/runtime at c92e06b), as its compose guide installs it
        env:
          E2B_RUNTIME: c92e06b2bd635cf5a1a351e1021d5f1dfaed87b6
        run: |
          mkdir -p "$RUNNER_TEMP/e2b" && cd "$RUNNER_TEMP/e2b"
          base="https://raw.githubusercontent.com/e2b-dev/runtime/$E2B_RUNTIME/embed/compose"
          curl -fsSL -o compose.yaml "$base/compose.yaml"
          curl -fsSL -o .env "$base/.env"
          echo "ba1c32fc02a29db5e8b24af015adb216d4569aa7a41aeffec2d2b98298fc5d99  compose.yaml" | sha256sum -c
          echo "9e647bc41cd12970367af7cba5f08a9787c6ea2fc6af5031aaad8d6a6903ed69  .env" | sha256sum -c
          # nbd must be available but not loaded: host-setup loads it with the devices it needs,
          # and stops when it is already loaded with fewer (modprobe's default is 16).
          modinfo nbd > /dev/null 2>&1 || sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          echo "PF_MIN_FREE_GIB=8" >> .env
          docker compose up -d --wait
          docker compose exec -T ready cat /run/e2b/sdk.env | sed -n 's/^export //p' > sdk.env
          while IFS= read -r line; do
            case "$line" in E2B_API_KEY=*) echo "::add-mask::${line#E2B_API_KEY=}" ;; esac
            echo "$line" | tr -d "'\"" >> "$GITHUB_ENV"
          done < sdk.env
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install Python environment, with E2B's SDK
        run: uv sync --locked --extra e2b
      - name: The E2B sandbox in microVMs
        env:
          REPRO_E2B_LIVE: "1"
          REPRO_E2B_MEMORY_MB: "1024"
        run: >
          uv run --locked pytest engine/tests/test_sandbox_e2b_live.py
          "engine/tests/test_run_stage.py::test_a_run_in_e2b_is_l5"
      - name: E2B's logs, when something failed
        if: failure()
        run: |
          cd "$RUNNER_TEMP/e2b"
          docker compose ps -a
          docker compose logs preflight host-setup fetch-artifacts base-template ready
          docker compose logs --tail 60 api orchestrator
          free -m
          grep -i huge /proc/meminfo
          lsmod | grep -E "^(nbd|kvm|tun)" || true

  # Needs the repository's Dependency graph (Settings -> Code security). Enable it, then set the
  # repository variable DEPENDENCY_REVIEW=true to turn this job on.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false # licences are enforced by scripts/check_licenses.py
