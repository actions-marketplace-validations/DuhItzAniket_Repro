# Re-runs the A08 feasibility spikes on a Linux host (GitHub-hosted runner) and uploads the raw
# JSON results. Not a required check: the numbers are measurements, not pass/fail gates.
name: Spikes (A08)

on:
  workflow_dispatch:
  pull_request:
    paths: # scripts only: committing results or prose must not re-run a 20-minute job
      - "spikes/A08/*.py"

permissions:
  contents: read

jobs:
  a08:
    name: A08 spikes (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          enable-cache: true
      - name: Install environment
        run: uv sync --locked
      - name: Tracer overhead (Python 3.12-3.15)
        run: |
          mkdir -p out
          for v in 3.12 3.13 3.14 3.15; do
            uv python install "$v"
            "$(uv python find "$v")" -I spikes/A08/tracer_bench.py drive --rounds 5 --repeats 15 \
              > "out/tracer-linux-gha-py$v.json"
          done
      - name: Docker sandbox round trip
        run: uv run python spikes/A08/sandbox_roundtrip.py --repeats 3 > out/sandbox-linux-gha-docker.json
      - name: Container provisioning (pallets/click)
        run: uv run python spikes/A08/provision_bench.py > out/provision-linux-gha-docker.json
      - name: Runner hardware class
        run: |
          { nproc; grep -m1 'model name' /proc/cpuinfo; free -g | awk '/Mem:/{print $2 " GiB"}'; } > out/runner.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: a08-spike-results-linux
          path: out/
          retention-days: 90
